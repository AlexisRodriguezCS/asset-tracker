// ---------------------------------------------------------------------------
// Shared code-quality configuration (vendored, offline, no secrets).
//
// Applied from each service's build.gradle via:
//     apply from: "$rootDir/gradle/quality.gradle"
//
// Assumes the including build already declares these plugins:
//     id 'com.diffplug.spotless'   (formatting)
//     id 'checkstyle'              (style + complexity gate)
//     id 'jacoco'                  (coverage report)
//
// Deliberately NOT here (they need network / accounts / secrets — they move
// back in during the CI phase): OWASP Dependency-Check, SonarQube, Snyk.
// ---------------------------------------------------------------------------

// --- Spotless: canonical formatting, auto-fixable with `./gradlew spotlessApply` ---
spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// --- Checkstyle: clean-code + complexity rules (see config/checkstyle/checkstyle.xml) ---
checkstyle {
    toolVersion = '10.20.1'
    configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
    configProperties = [
        'org.checkstyle.suppressions.file': file("$rootDir/config/checkstyle/suppressions.xml").absolutePath
    ]
    ignoreFailures = false
    maxWarnings = 0
    showViolations = true
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

// Wire the quality tasks into `check` so `./gradlew build` enforces them.
tasks.named('check').configure {
    dependsOn 'spotlessCheck', 'checkstyleMain', 'checkstyleTest'
}

// --- JaCoCo: report, plus a per-service coverage floor that only goes up ---
//
// Not measured, because a percentage that counts these is measuring the wrong
// thing and rewards tests written for accessors:
//   *Application.class  - a main() and nothing else
//   config/**           - Spring wiring, exercised by every context that loads
//   dto/**              - records: canonical constructor, accessors, equals
// Entities are NOT excluded: guarded transitions like Asset.assignTo() are real
// logic with real tests, and hiding them would flatter the number.
def coverageExclusions = [
    '**/*Application.class',
    '**/config/**',
    '**/dto/**',
]

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.withType(JacocoReportBase).configureEach {
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, exclude: coverageExclusions)
        })
    )
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// A ratchet, not an aspiration.
//
// These are each about three points under what the service actually covers
// today, so the gate locks in the tests that exist and fails the build if
// somebody deletes them or adds a slab of untested code. It is deliberately not
// one number: a flat 80% across a monorepo where services range from 19% to 55%
// is a gate nobody can turn on, which is exactly why the last attempt at this
// stayed a to-do for months.
//
// The rule for changing them: raise a floor when its service climbs past it.
// Never lower one to make a red build green - that is the ratchet slipping,
// and it is the only thing that makes a number like this worthless.
def coverageFloors = [
    'asset-service'       : 0.52,
    'assignment-service'  : 0.41,
    'api-gateway'         : 0.35,
    'people-service'      : 0.30,
    'client-service'      : 0.28,
    'auth-service'        : 0.28,
    'location-service'    : 0.20,
    'notification-service': 0.15,
]

// :e2e is a test-only project - it has no main source set to cover.
if (project.name != 'e2e') {
    tasks.named('jacocoTestCoverageVerification') {
        dependsOn tasks.named('jacocoTestReport')
        violationRules {
            rule {
                limit {
                    counter = 'INSTRUCTION'
                    value = 'COVEREDRATIO'
                    // a new service starts low rather than blocking its first commit
                    minimum = coverageFloors.getOrDefault(project.name, 0.10) as BigDecimal
                }
            }
        }
    }

    tasks.named('check').configure {
        dependsOn tasks.named('jacocoTestCoverageVerification')
    }
}
