---
spring:
  application:
    name: auth-service
  flyway:
    enabled: false   # dev runs on H2 + ddl-auto; the 'prod' profile enables Flyway
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true   # dev only - lets the browser reach the in-container console

server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    # RS256. The signing key pair is generated at startup; the public half is
    # served at /.well-known/jwks.json for the gateway to fetch. No shared secret.
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    issuer: ${JWT_ISSUER:asset-tracker-auth}
  # "Sign in with Microsoft 365". Blank issuer-uri / client-id = feature off
  # (POST /auth/microsoft answers 501). Set both after registering an Entra app.
  entra:
    issuer-uri: ${ENTRA_ISSUER_URI:}
    client-id: ${ENTRA_CLIENT_ID:}
    default-client-ids: ${ENTRA_DEFAULT_CLIENT_IDS:1,2,3}

logging:
  pattern:
    # every log line carries the request's correlation id (see CorrelationIdFilter)
    correlation: "[%X{correlationId:-}] "
  # flip to LOG_FORMAT=ecs for newline-delimited JSON logs (Spring Boot native, no dep)
  structured:
    format:
      console: ${LOG_FORMAT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
