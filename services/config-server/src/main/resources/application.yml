---
spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Local dev resolves the sibling config-repo checkout; Docker overrides
          # this with CONFIG_REPO_LOCATIONS=file:/config-repo,file:/config-repo/{application}
          search-locations: ${CONFIG_REPO_LOCATIONS:file:../config-repo,file:../config-repo/{application}}
      fail-fast: false

server:
  port: ${SERVER_PORT:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Kept local, unlike the business services. This server cannot bootstrap its own
# configuration from itself, so config-repo cannot reach it - and without an
# explicit actuator mapping its /{application}/{profile} handler answers
# /actuator/prometheus itself, returning config JSON. Prometheus then drops the
# target with "unsupported Content-Type application/json", which is a confusing
# way to find out.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
