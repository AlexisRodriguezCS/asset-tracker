---
# Actuator exposure and log levels are shared - see config-repo/application.yml.
# Setting them here would silently win over it (an imported config has lower
# precedence than the file importing it), which is how they got out of sync.
spring:
  data:
    web:
      pageable:
        # a caller cannot pull the whole tenant through the paged route
        default-page-size: 50
        max-page-size: 200
  application:
    name: asset-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  servlet:
    multipart:
      max-file-size: 10MB      # spreadsheet import
      max-request-size: 12MB
  flyway:
    enabled: false   # dev runs on H2 + ddl-auto; the 'prod' profile enables Flyway
  datasource:
    url: jdbc:h2:mem:assetdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true   # dev only - lets the browser reach the in-container console

server:
  port: ${SERVER_PORT:8083}

logging:
  pattern:
    # every log line carries the request's correlation id (see CorrelationIdFilter)
    correlation: "[%X{correlationId:-}] "
  # flip to LOG_FORMAT=ecs for newline-delimited JSON logs (Spring Boot native, no dep)
  structured:
    format:
      console: ${LOG_FORMAT:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# The caller's token is validated here, not just at the gateway. Same names the
# gateway uses, so one JWKS URI and one issuer are set for the whole stack.
security:
  jwt:
    # Fetched lazily and cached, so this service starts whether or not auth-service
    # is up yet.
    jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    # Checked as well as the signature: without it a token from any JWK set this
    # service happens to trust would pass.
    issuer: ${JWT_ISSUER:asset-tracker-auth}
