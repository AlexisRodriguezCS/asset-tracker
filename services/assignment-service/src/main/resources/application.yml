---
# Actuator exposure and log levels are shared - see config-repo/application.yml.
# Setting them here would silently win over it (an imported config has lower
# precedence than the file importing it), which is how they got out of sync.
spring:
  application:
    name: assignment-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  flyway:
    enabled: false   # dev runs on H2 + ddl-auto; the 'prod' profile enables Flyway
  datasource:
    url: jdbc:h2:mem:assignmentdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true   # dev only - lets the browser reach the in-container console
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}

server:
  port: ${SERVER_PORT:8082}

downstream:
  asset-service: ${ASSET_SERVICE_URL:lb://asset-service}

# Custody changes are published here; notification-service consumes them.
messaging:
  exchange: ${MESSAGING_EXCHANGE:asset-tracker.events}

# Retry transient failures a few times; if asset-service keeps failing, open the
# circuit and fail fast. 409 / 422 are business outcomes, not failures - ignored.
resilience4j:
  retry:
    instances:
      asset-service:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - com.assettracker.assignmentservice.service.AssetUnavailableException
          - com.assettracker.assignmentservice.service.AssetNotMovableException
  circuitbreaker:
    instances:
      asset-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.assettracker.assignmentservice.service.AssetUnavailableException
          - com.assettracker.assignmentservice.service.AssetNotMovableException

logging:
  pattern:
    # every log line carries the request's correlation id (see CorrelationIdFilter)
    correlation: "[%X{correlationId:-}] "
  # flip to LOG_FORMAT=ecs for newline-delimited JSON logs (Spring Boot native, no dep)
  structured:
    format:
      console: ${LOG_FORMAT:}

  health:
    circuitbreakers:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# The caller's token is validated here, not just at the gateway. Same names the
# gateway uses, so one JWKS URI and one issuer are set for the whole stack.
security:
  jwt:
    # Fetched lazily and cached, so this service starts whether or not auth-service
    # is up yet.
    jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    # Checked as well as the signature: without it a token from any JWK set this
    # service happens to trust would pass.
    issuer: ${JWT_ISSUER:asset-tracker-auth}
