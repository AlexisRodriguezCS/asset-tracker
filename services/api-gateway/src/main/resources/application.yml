---
spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates: [ Path=/api/auth/** ]
              filters: [ StripPrefix=1 ]
            - id: client-service
              uri: lb://client-service
              predicates: [ Path=/api/clients/** ]
              filters: [ StripPrefix=1 ]
            - id: people-service
              uri: lb://people-service
              predicates: [ Path=/api/people/** ]
              filters: [ StripPrefix=1 ]
            - id: location-service
              uri: lb://location-service
              predicates: [ Path=/api/locations/** ]
              filters: [ StripPrefix=1 ]
            - id: asset-service
              uri: lb://asset-service
              predicates: [ Path=/api/assets/** ]
              filters: [ StripPrefix=1 ]
            - id: assignment-service
              uri: lb://assignment-service
              predicates: [ Path=/api/assignments/** ]
              filters: [ StripPrefix=1 ]
            - id: notification-service
              uri: lb://notification-service
              predicates: [ Path=/api/notifications/** ]
              filters: [ StripPrefix=1 ]

security:
  # Local tokens issued by auth-service (RS256), validated against its JWK set.
  jwt:
    local:
      issuer: ${JWT_ISSUER:asset-tracker-auth}
      jwk-set-uri: ${JWT_JWKS_URI:http://auth-service:8081/.well-known/jwks.json}
  # When ENTRA_ISSUER_URI is set, "Sign in with Microsoft 365" tokens are also
  # accepted. Leave blank to run with no Azure dependency.
  entra:
    issuer-uri: ${ENTRA_ISSUER_URI:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Brute-force brake on POST /api/auth/**. Counted per gateway instance, so a
  # multi-replica deployment divides the budget by its replica count (the cloud
  # overlay runs two and sets 5). See AuthRateLimitFilter.
  rate-limit:
    max-per-window: ${AUTH_RATE_LIMIT_MAX:10}
    window-ms: ${AUTH_RATE_LIMIT_WINDOW_MS:60000}

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    # every log line carries the request's correlation id (see CorrelationIdFilter)
    correlation: "[%X{correlationId:-}] "
  # flip to LOG_FORMAT=ecs for newline-delimited JSON logs (Spring Boot native, no dep)
  structured:
    format:
      console: ${LOG_FORMAT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
