---
spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    listener:
      simple:
        missing-queues-fatal: false   # keep starting even if the broker is down

server:
  port: ${SERVER_PORT:8086}

# Consumes custody-change events published by assignment-service.
messaging:
  exchange: ${MESSAGING_EXCHANGE:asset-tracker.events}
  queue: ${MESSAGING_QUEUE:notification.events}

logging:
  pattern:
    # every log line carries the request's correlation id (see CorrelationIdFilter)
    correlation: "[%X{correlationId:-}] "
  # flip to LOG_FORMAT=ecs for newline-delimited JSON logs (Spring Boot native, no dep)
  structured:
    format:
      console: ${LOG_FORMAT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
