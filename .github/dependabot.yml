# Grouped, monthly dependency updates: at most one PR per ecosystem per month.
# Major version bumps are ignored - those are deliberate, reviewed upgrades.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(deps)" }
    groups:
      gradle: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build(deps)" }
    groups:
      npm: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: "docker"
    directory: "/"
    schedule: { interval: "monthly" }
    commit-message: { prefix: "build(deps)" }
    groups:
      docker: { patterns: ["*"] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
