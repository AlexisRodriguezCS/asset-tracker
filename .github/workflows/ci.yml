name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # One Gradle multi-project build: compile + test + Spotless + Checkstyle + JaCoCo
  # for every service and the e2e module.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --no-daemon --console=plain
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: "**/build/reports/"
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run typecheck

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks via its official image - the marketplace action needs a paid
      # licence for GitHub organisations. Pinned because ":latest" makes the scan
      # non-reproducible and silently changes what gates every push. Dependabot
      # does not see images used inside a `run:` step, so bump this by hand.
      - name: gitleaks
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --redact --verbose

  images:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop') }}
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - config-server
          - api-gateway
          - auth-service
          - client-service
          - people-service
          - location-service
          - asset-service
          - assignment-service
          - notification-service
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase owner (GHCR requires it)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # buildx + a per-service Actions cache: without it every one of the ten
      # matrix legs re-downloads the Gradle distribution and the whole
      # dependency graph on every push.
      - uses: docker/setup-buildx-action@v3
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/asset-tracker-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/asset-tracker-${{ matrix.service }}:${{ github.ref_name }}

  # Stand the ten images that were just published up as a real stack and drive it
  # through the gateway. The suite self-skips when no stack is reachable, so this
  # job sets E2E_REQUIRED=true - without it a stack that never booted would report
  # green, which is what happened for as long as nothing ran the suite at all.
  e2e:
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Named explicitly so Prometheus and Grafana stay down - the suite doesn't
      # use them and a 7GB runner is already hosting ten JVMs. Compose still
      # starts each service's depends_on (discovery, config, rabbitmq).
      - name: Start the stack from the images built above
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -f infra/compose/docker-compose.yml \
                         -f infra/compose/docker-compose.ci.yml up -d \
            api-gateway auth-service client-service people-service \
            location-service asset-service assignment-service notification-service

      # Container health only says a service booted. The gateway additionally has
      # to resolve the route through Eureka, which lags healthy by ~20-30s on a
      # cold stack, so poll the routed endpoint the suite actually calls.
      - name: Wait for the gateway to route
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:8080/api/assets?clientId=1" > /dev/null 2>&1; then
              echo "gateway routing after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "::error::gateway never started routing"
          exit 1

      - name: Run the e2e suite
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_REQUIRED: "true"
        run: ./gradlew :e2e:test --no-daemon --console=plain

      - name: Stack logs (on failure)
        if: failure()
        run: |
          docker compose -f infra/compose/docker-compose.yml \
                         -f infra/compose/docker-compose.ci.yml ps
          docker compose -f infra/compose/docker-compose.yml \
                         -f infra/compose/docker-compose.ci.yml logs --tail=200

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/build/reports/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          docker compose -f infra/compose/docker-compose.yml \
                         -f infra/compose/docker-compose.ci.yml down -v
