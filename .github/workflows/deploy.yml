# Manual deploy to a Kubernetes cluster.
#
# SKELETON - not wired to a live cluster. It documents the target flow:
# OIDC federation to the cloud (no stored credentials), pull the freshly built
# images by commit SHA, and `kubectl apply -k` the cloud overlay.
#
# Before first use:
#   1. Create an Entra workload-identity / IAM role that trusts this repo's
#      GitHub OIDC subject and can get AKS credentials (see docs/deployment.md).
#   2. Add repo variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#      AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME.
#   3. Add the environment's endpoints as repo/environment variables: PG_HOST,
#      BROKER_HOST, CONSOLE_HOST. The "Render the overlay" step substitutes them
#      into the cloud overlay's placeholders and refuses to deploy if any is unset.
name: deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (a commit SHA already pushed to GHCR by ci.yml)
        required: true
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write   # OIDC federation - no cloud credentials are stored

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC federation)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Render the overlay
        working-directory: deploy/k8s/overlays/cloud
        env:
          # via env, not inline ${{ }}, so nothing here can be shell-injected
          IMAGE_TAG: ${{ inputs.image_tag }}
          PG_HOST: ${{ vars.PG_HOST }}
          BROKER_HOST: ${{ vars.BROKER_HOST }}
          CONSOLE_HOST: ${{ vars.CONSOLE_HOST }}
        run: |
          set -euo pipefail

          for v in IMAGE_TAG PG_HOST BROKER_HOST CONSOLE_HOST; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty - set it as a repo/environment variable before deploying"
              exit 1
            fi
          done

          # kubectl >=1.27 ships kustomize; set the SHA on every image
          sed -i "s|newTag: main|newTag: ${IMAGE_TAG}|g" kustomization.yaml
          sed -i "s|__PG_HOST__|${PG_HOST}|g;
                  s|__BROKER_HOST__|${BROKER_HOST}|g;
                  s|__CONSOLE_HOST__|${CONSOLE_HOST}|g" kustomization.yaml

          if grep -n "__[A-Z_]\+__\|newTag: main" kustomization.yaml; then
            echo "::error::the overlay still has unsubstituted placeholders (above)"
            exit 1
          fi

          kubectl kustomize . > /dev/null   # sanity render after the rewrite

      - name: Deploy
        run: |
          kubectl apply -k deploy/k8s/overlays/cloud
          kubectl -n asset-tracker rollout status deployment/api-gateway --timeout=300s

      - name: Smoke check
        run: |
          kubectl -n asset-tracker get pods
          kubectl -n asset-tracker exec deploy/api-gateway -- \
            curl -fsS http://localhost:8080/actuator/health
