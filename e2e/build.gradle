description = 'End-to-end API tests: drive the running platform through the gateway.'

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.rest-assured:rest-assured:5.5.7'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// These tests only make sense against a running stack. They self-skip (JUnit
// assumption) when the gateway isn't reachable, so `./gradlew build` stays green
// where no stack is up. The dedicated CI stage sets E2E_REQUIRED=true, which turns
// "unreachable" into a failure instead of a skip - otherwise a stack that never
// came up would report green, which is exactly what used to happen.
tasks.named('test') {
    systemProperty 'e2e.baseUrl',
        System.getProperty('e2e.baseUrl', System.getenv('E2E_BASE_URL') ?: 'http://localhost:8080')
    systemProperty 'e2e.required',
        System.getProperty('e2e.required', System.getenv('E2E_REQUIRED') ?: 'false')
    testLogging { events 'passed', 'skipped', 'failed' }
    // the stack is external state Gradle can't see; never call this task up-to-date
    outputs.upToDateWhen { false }
}
