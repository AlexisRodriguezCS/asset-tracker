apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels: { app.kubernetes.io/name: notification-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: notification-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notification-service }
    spec:
      containers:
        - name: notification-service
          image: assettracker/notification-service:latest
          ports:
            - { name: http, containerPort: 8086 }
          envFrom:
            - configMapRef: { name: asset-tracker-env }
          env:
            - { name: SERVER_PORT, value: "8086" }
          resources:
            requests: { cpu: "100m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels: { app.kubernetes.io/name: notification-service }
spec:
  selector: { app.kubernetes.io/name: notification-service }
  ports:
    - { name: http, port: 8086, targetPort: http }
