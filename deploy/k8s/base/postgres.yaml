# Single-replica Postgres for local / demo clusters. In a real deployment the
# cloud overlay removes this file and PG_HOST points at a managed instance
# (Azure Database for PostgreSQL Flexible Server / Amazon RDS).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
data:
  # Mirrors infra/compose/postgres/init.sql - one database per JPA service.
  init.sql: |
    CREATE DATABASE authdb;
    CREATE DATABASE clientdb;
    CREATE DATABASE peopledb;
    CREATE DATABASE locationdb;
    CREATE DATABASE assetdb;
    CREATE DATABASE assignmentdb;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: asset-tracker-db, key: SPRING_DATASOURCE_USERNAME } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: asset-tracker-db, key: SPRING_DATASOURCE_PASSWORD } }
            - { name: POSTGRES_DB, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "att"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "att"] }
            periodSeconds: 20
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - name: initdb
          configMap: { name: postgres-initdb }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
