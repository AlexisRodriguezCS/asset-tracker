apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  labels: { app.kubernetes.io/name: discovery-server }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: discovery-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: discovery-server }
    spec:
      containers:
        - name: discovery-server
          image: assettracker/discovery-server:latest
          ports:
            - { name: http, containerPort: 8761 }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  labels: { app.kubernetes.io/name: discovery-server }
spec:
  selector: { app.kubernetes.io/name: discovery-server }
  ports:
    - { name: http, port: 8761, targetPort: http }
