---
# Let in-flight requests finish on SIGTERM (rolling updates / `compose stop`).
server:
  shutdown: graceful
  tomcat:
    threads:
      # Tomcat defaults to 200 worker threads per service. Ten services on one
      # host is 2000 potential threads for a workload that measures ~35 live
      # threads each; the ceiling is what a burst can cost, not what is in use.
      max: 40
      min-spare: 5

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    # DEBUG here logs every dispatch. Useful while chasing a routing problem,
    # miserable as a permanent default - which is what it was until someone
    # looked at the volume. Raise it for one service at a time instead, either
    # with this variable or through the loggers endpoint below, which changes a
    # level on a running service without a redeploy:
    #   curl -X POST localhost:8083/actuator/loggers/org.springframework.web \
    #     -H 'Content-Type: application/json' -d '{"configuredLevel":"DEBUG"}'
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    com.assettracker: ${LOG_LEVEL_APP:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, loggers
  endpoint:
    health:
      show-details: always
      # expose /actuator/health/liveness and /readiness as first-class probes
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    enable:
      all: true
  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
    # Defaults (30s registry fetch, 30s heartbeat, 90s lease, plus the server's
    # own 30s response cache) leave a cold stack unable to make one service call
    # another for ~50s - the first check-out after `compose up` used to 503.
    # Ten small services on one network can afford to gossip more often; this is
    # the dominant term in startup convergence. See infra/RUNBOOK.md.
    registry-fetch-interval-seconds: 5

  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

