---
# Let in-flight requests finish on SIGTERM (rolling updates / `compose stop`).
server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
      # expose /actuator/health/liveness and /readiness as first-class probes
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    enable:
      all: true
  tracing:
    sampling:
      probability: 1.0

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
    # Defaults (30s registry fetch, 30s heartbeat, 90s lease, plus the server's
    # own 30s response cache) leave a cold stack unable to make one service call
    # another for ~50s - the first check-out after `compose up` used to 503.
    # Ten small services on one network can afford to gossip more often; this is
    # the dominant term in startup convergence. See infra/RUNBOOK.md.
    registry-fetch-interval-seconds: 5

  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

