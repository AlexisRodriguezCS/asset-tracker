<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Asset Tracker">
  <title>Asset Tracker</title>
  <!--
    The nav's brand mark as a favicon: the same purple gradient tile, the same
    three-box figure.

    The nav draws lucide's `Boxes` as strokes. Reused literally that would be
    twelve 1.5px lines inside a 16px tab icon, which resolves to grey mush - so
    the three box outlines are filled instead of stroked. Same figure, same
    silhouette, legible at the size it is actually seen.

    Colours are the brand tokens resolved to hex, because an SVG served as a
    favicon gets no stylesheet: the primary (#4a247f) to primary-2 (#7e40b5) pair,
    at the same 100deg the bg-gradient-primary utility uses.
  -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#4a247f" />
      <stop offset="1" stop-color="#7e40b5" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#mark)" />

  <g transform="translate(4 4)" fill="#ffffff">
    <!-- top box -->
    <path d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z" />
    <!-- bottom left, held slightly apart so the three read as separate boxes -->
    <path opacity="0.92" d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z" />
    <!-- bottom right -->
    <path opacity="0.78" d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z" />
  </g>
</svg>
