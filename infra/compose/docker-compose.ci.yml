# CI overlay: run the stack from the GHCR images ci.yml just published, rather
# than building them again. Used by the "e2e" job in .github/workflows/ci.yml.
#
#   IMAGE_TAG=<sha> docker compose \
#     -f docker-compose.yml -f docker-compose.ci.yml up -d
#
# `build: !reset null` drops the build section inherited from docker-compose.yml
# so Compose pulls instead of building. IMAGE_TAG should be a commit SHA; the
# "main" default is only for poking at it by hand.

name: asset-tracker

x-img: &img
  build: !reset null
  pull_policy: always

services:
  discovery-server:     { <<: *img, image: "ghcr.io/alexisrodriguezcs/asset-tracker-discovery-server:${IMAGE_TAG:-main}" }
  config-server:        { <<: *img, image: "ghcr.io/alexisrodriguezcs/asset-tracker-config-server:${IMAGE_TAG:-main}" }
  api-gateway:          { <<: *img, image: "ghcr.io/alexisrodriguezcs/asset-tracker-api-gateway:${IMAGE_TAG:-main}" }
  auth-service:         { <<: *img, image: "ghcr.io/alexisrodriguezcs/asset-tracker-auth-service:${IMAGE_TAG:-main}" }
  client-service:       { <<: *img, image: "ghcr.io/alexisrodriguezcs/asset-tracker-client-service:${IMAGE_TAG:-main}" }
  people-service:       { <<: *img, image: "ghcr.io/alexisrodriguezcs/asset-tracker-people-service:${IMAGE_TAG:-main}" }
  location-service:     { <<: *img, image: "ghcr.io/alexisrodriguezcs/asset-tracker-location-service:${IMAGE_TAG:-main}" }
  asset-service:        { <<: *img, image: "ghcr.io/alexisrodriguezcs/asset-tracker-asset-service:${IMAGE_TAG:-main}" }
  assignment-service:   { <<: *img, image: "ghcr.io/alexisrodriguezcs/asset-tracker-assignment-service:${IMAGE_TAG:-main}" }
  notification-service: { <<: *img, image: "ghcr.io/alexisrodriguezcs/asset-tracker-notification-service:${IMAGE_TAG:-main}" }
