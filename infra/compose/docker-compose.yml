# Local, offline stack for asset-tracker.
#
#   docker compose -f infra/compose/docker-compose.yml up -d --build
#   docker compose -f infra/compose/docker-compose.yml ps
#   docker compose -f infra/compose/docker-compose.yml down
#
# Build context is the repo root so each service builds out of the Gradle
# multi-project. Databases are in-memory H2 - data resets on restart; the
# postgres overlay makes them persist.

name: asset-tracker

# Ten JVMs on one host. Sized from measurement, not defaults.
#
# Without a ceiling each JVM sizes its GC threads, ForkJoinPool and Tomcat pool
# for every core on the host, and all ten do it at once during `up`, which
# starves the host - including Docker Desktop's own backend. ActiveProcessorCount
# is what actually shrinks those pools; `cpus` only throttles afterwards, and a
# throttled-but-16-core-sized JVM is the worst of both.
#
# Measured heap in use per service is 39-69MB, so a percentage-of-container heap
# was handing each one a 483MB ceiling it never approached. 224MB is ~3x the
# observed peak - room for a burst without paying for it at rest. Metaspace is
# capped because it grows silently and is the largest single piece of a Spring
# service's footprint (~100MB of classes).
#
# -XX:TieredStopAtLevel=1 was tried here and removed. It saves ~35MB a service,
# but load testing through the gateway showed it *halves* throughput once there
# is any concurrency: 1481 -> 3060 req/s at 50 concurrent, and p95 35ms instead
# of 60ms. Paying twice the hardware to save a third of a gigabyte is the wrong
# way round. Keep the JIT free to reach C2.
x-jvm: &jvm-sizing
  JAVA_TOOL_OPTIONS: >-
    -XX:ActiveProcessorCount=2
    -Xms96m
    -Xmx224m
    -XX:MaxMetaspaceSize=160m
    -XX:+UseSerialGC
    -Xss512k
    -Dspring.jmx.enabled=false

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [att]
  cpus: 2
  # heap 224 + metaspace 160 + code cache 64 + stacks/native ~60 => ~510MB worst
  # case, so 576 leaves headroom without letting a leak take the host with it.
  mem_limit: 576m
  environment: &common-env
    <<: *jvm-sizing
    # Structured logs on demand. The services read this, but it was never passed
    # into the containers, so the RUNBOOK documented a switch that did nothing.
    LOG_FORMAT: ${LOG_FORMAT:-}
    LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
    LOG_LEVEL_WEB: ${LOG_LEVEL_WEB:-INFO}
    LOG_LEVEL_SQL: ${LOG_LEVEL_SQL:-WARN}
    LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    CONFIG_SERVER_URL: http://config-server:8888
    SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
  depends_on:
    discovery-server:
      condition: service_healthy
    config-server:
      condition: service_healthy

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

x-build: &build-root
  context: ../..

networks:
  att:
    driver: bridge

services:
  discovery-server:
    build: { <<: *build-root, dockerfile: services/discovery-server/Dockerfile }
    image: assettracker/discovery-server
    container_name: discovery-server
    restart: unless-stopped
    networks: [att]
    cpus: 2
    mem_limit: 512m
    environment:
      <<: *jvm-sizing
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      <<: *healthcheck
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    networks: [att]
    cpus: 2
    mem_limit: 512m
    environment:
      # The Erlang VM starts one scheduler per visible host CPU - 16 of them for a
      # broker this idle - and they are what makes RabbitMQ spike during startup.
      # `cpus` alone would not help: it throttles the schedulers rather than
      # reducing them.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    ports: ["5672:5672", "15672:15672"]   # amqp + management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      <<: *healthcheck
      start_period: 30s

  config-server:
    build: { <<: *build-root, dockerfile: services/config-server/Dockerfile }
    image: assettracker/config-server
    container_name: config-server
    restart: unless-stopped
    networks: [att]
    cpus: 2
    mem_limit: 512m
    ports: ["8888:8888"]
    environment:
      <<: *jvm-sizing
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      CONFIG_REPO_LOCATIONS: file:/config-repo,file:/config-repo/{application}
    volumes:
      - ../../config-repo:/config-repo:ro
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      <<: *healthcheck

  api-gateway:
    <<: *service-defaults
    build: { <<: *build-root, dockerfile: services/api-gateway/Dockerfile }
    image: assettracker/api-gateway
    container_name: api-gateway
    ports: ["8080:8080"]
    environment:
      <<: *common-env
      JWT_ISSUER: ${JWT_ISSUER:-asset-tracker-auth}
      JWT_JWKS_URI: ${JWT_JWKS_URI:-http://auth-service:8081/.well-known/jwks.json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ENTRA_ISSUER_URI: ${ENTRA_ISSUER_URI:-}
      # per-instance auth brake; see infra/RUNBOOK.md "Rate limiting"
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-60000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      <<: *healthcheck

  auth-service:
    <<: *service-defaults
    build: { <<: *build-root, dockerfile: services/auth-service/Dockerfile }
    image: assettracker/auth-service
    container_name: auth-service
    ports: ["8081:8081"]
    environment:
      <<: *common-env
      JWT_ISSUER: ${JWT_ISSUER:-asset-tracker-auth}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      # Unset by default: the service then generates a key and warns that tokens
      # will not survive a restart. Put a PEM in ./secrets and point this at it
      # (see secrets/README.md) to keep sessions across restarts, as the cloud
      # overlay does with the asset-tracker-jwt secret.
      JWT_PRIVATE_KEY_FILE: ${JWT_PRIVATE_KEY_FILE:-}
      ENTRA_ISSUER_URI: ${ENTRA_ISSUER_URI:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_DEFAULT_CLIENT_IDS: ${ENTRA_DEFAULT_CLIENT_IDS:-1,2,3}
    volumes:
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      <<: *healthcheck

  client-service:
    <<: *service-defaults
    build: { <<: *build-root, dockerfile: services/client-service/Dockerfile }
    image: assettracker/client-service
    container_name: client-service
    ports: ["8085:8085"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      <<: *healthcheck

  people-service:
    <<: *service-defaults
    build: { <<: *build-root, dockerfile: services/people-service/Dockerfile }
    image: assettracker/people-service
    container_name: people-service
    ports: ["8087:8087"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      <<: *healthcheck

  location-service:
    <<: *service-defaults
    build: { <<: *build-root, dockerfile: services/location-service/Dockerfile }
    image: assettracker/location-service
    container_name: location-service
    ports: ["8084:8084"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      <<: *healthcheck

  asset-service:
    <<: *service-defaults
    build: { <<: *build-root, dockerfile: services/asset-service/Dockerfile }
    image: assettracker/asset-service
    container_name: asset-service
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      <<: *healthcheck

  assignment-service:
    <<: *service-defaults
    build: { <<: *build-root, dockerfile: services/assignment-service/Dockerfile }
    image: assettracker/assignment-service
    container_name: assignment-service
    ports: ["8082:8082"]
    environment:
      <<: *common-env
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      asset-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      <<: *healthcheck

  notification-service:
    <<: *service-defaults
    build: { <<: *build-root, dockerfile: services/notification-service/Dockerfile }
    image: assettracker/notification-service
    container_name: notification-service
    ports: ["8086:8086"]
    environment:
      <<: *common-env
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      <<: *healthcheck

  # --- Observability stack (Prometheus scrapes /actuator/prometheus; Grafana
  #     is pre-provisioned with the datasource + an asset-tracker dashboard) ---
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    networks: [att]
    cpus: 1
    mem_limit: 384m
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    networks: [att]
    cpus: 1
    mem_limit: 384m
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
