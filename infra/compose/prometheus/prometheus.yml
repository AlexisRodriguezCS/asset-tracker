global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: asset-tracker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - auth-service:8081
          - assignment-service:8082
          - asset-service:8083
          - location-service:8084
          - client-service:8085
          - notification-service:8086
          - people-service:8087
          - config-server:8888
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
        replacement: '$1'
